<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusPing</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1 class="popup__title">FocusPing</h1>
      </header>

      <section class="popup__status">
        <div id="status-indicator" class="status-indicator" data-status="loading">
          <span class="status-indicator__icon"></span>
          <div class="status-indicator__content">
            <h2 id="status-title" class="status-indicator__title">Loading...</h2>
            <p id="status-message" class="status-indicator__message"></p>
          </div>
        </div>
      </section>

      <section class="popup__controls">
        <div class="control-group">
          <label class="control-label">Mode</label>
          <div class="mode-toggle" role="radiogroup" aria-label="Intervention mode">
            <label class="mode-toggle__option">
              <input id="mode-gentle" type="radio" name="mode" value="gentle" />
              <span>Gentle</span>
            </label>
            <label class="mode-toggle__option">
              <input id="mode-strict" type="radio" name="mode" value="strict" />
              <span>Strict</span>
            </label>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label" for="reminder-frequency">
            Reminder frequency
            <span id="reminder-value" class="control-value">5 min</span>
          </label>
          <input
            id="reminder-frequency"
            type="range"
            min="5"
            max="240"
            step="1"
            value="5"
            class="slider"
          />
        </div>
      </section>

      <section class="popup__actions">
        <button id="add-site" type="button" class="popup__button popup__button--secondary">
          <span class="button-icon">+</span>
          Add Site to Watch List
        </button>
        <button id="open-options" type="button" class="popup__button popup__button--primary">
          Open Settings
        </button>
      </section>
    </main>

    <div id="add-site-modal" class="modal" hidden>
      <div class="modal__overlay"></div>
      <div class="modal__content">
        <h3 class="modal__title">Add Site to Watch List</h3>
        <p id="modal-site-info" class="modal__message"></p>
        <div class="modal__actions">
          <button id="add-exact-url" type="button" class="popup__button popup__button--secondary">
            Add Exact URL
          </button>
          <button id="add-base-domain" type="button" class="popup__button popup__button--primary">
            Add Base Domain
          </button>
          <button id="cancel-add" type="button" class="popup__button popup__button--text">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
