<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusPing Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="options">
      <header class="options-header">
        <h1>FocusPing Settings</h1>
        <p class="options-subtitle">Configure your focus monitoring preferences</p>
      </header>

      <section class="settings-section">
        <h2>Mode</h2>
        <div class="mode-selector">
          <label class="mode-card">
            <input type="radio" name="mode" value="gentle" />
            <div class="mode-card__content">
              <div class="mode-card__icon">💬</div>
              <div class="mode-card__title">Gentle</div>
              <div class="mode-card__description">Dismissible toast notifications</div>
            </div>
          </label>
          <label class="mode-card">
            <input type="radio" name="mode" value="strict" />
            <div class="mode-card__content">
              <div class="mode-card__icon">🛡️</div>
              <div class="mode-card__title">Strict</div>
              <div class="mode-card__description">Full-page overlay intervention</div>
            </div>
          </label>
        </div>
      </section>

      <section class="settings-section">
        <h2>Focus schedule</h2>
        <div class="time-inputs">
          <label class="time-input">
            <span class="time-input__label">Start time</span>
            <input id="schedule-start" type="time" />
          </label>
          <label class="time-input">
            <span class="time-input__label">End time</span>
            <input id="schedule-end" type="time" />
          </label>
        </div>
        <label class="checkbox-label">
          <input id="schedule-paused" type="checkbox" />
          <span>Pause monitoring outside schedule</span>
        </label>
      </section>

      <section class="settings-section">
        <h2>Reminder behavior</h2>
        <div class="slider-control">
          <label for="reminder-frequency" class="slider-control__label">
            <span>Reminder frequency</span>
            <span id="reminder-value" class="slider-control__value">5 sec</span>
          </label>
          <input 
            id="reminder-frequency" 
            type="range" 
            min="5" 
            max="300" 
            step="1" 
            value="5"
            class="slider-control__slider"
          />
          <div class="slider-control__marks">
            <span>5s</span>
            <span>1m</span>
            <span>5m</span>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h2>Distracting sites</h2>
        <form id="blocklist-form" class="blocklist-form">
          <input
            id="domain-input"
            type="url"
            inputmode="url"
            autocomplete="off"
            placeholder="https://example.com"
          />
          <button type="submit">Add domain</button>
        </form>
        <p id="domain-error" class="form-error" role="alert" aria-live="assertive" hidden></p>
        <table class="blocklist-table" aria-live="polite">
          <caption class="sr-only">
            Distracting domains
          </caption>
          <thead>
            <tr>
              <th scope="col">Domain</th>
              <th scope="col" class="actions">Status</th>
              <th scope="col" class="actions">Actions</th>
            </tr>
          </thead>
          <tbody id="blocklist-body"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
