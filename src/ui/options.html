<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusPing Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="options">
      <h1>FocusPing Settings</h1>
      <section>
        <h2>Mode</h2>
        <label><input type="radio" name="mode" value="gentle" /> Gentle</label>
        <label><input type="radio" name="mode" value="strict" /> Strict</label>
      </section>
      <section>
        <h2>Focus schedule</h2>
        <label>
          Start
          <input id="schedule-start" type="time" />
        </label>
        <label>
          End
          <input id="schedule-end" type="time" />
        </label>
        <label><input id="schedule-paused" type="checkbox" /> Pause outside schedule</label>
      </section>
      <section>
        <h2>Reminder behavior</h2>
        <label>
          Reminder cadence (minutes)
          <input id="reminder-frequency" type="number" min="0.08" max="60" step="0.01" />
        </label>
        <label>
          Snooze duration (minutes)
          <input id="snooze-duration" type="number" min="0.08" max="60" step="0.01" />
        </label>
        <label><input id="gif-toggle" type="checkbox" /> Show humorous GIFs</label>
        <div id="gif-preview" class="gif-preview" role="img" aria-live="polite">
          <div class="gif-preview__media" aria-hidden="true"></div>
          <div class="gif-preview__content">
            <p class="gif-preview__eyebrow">Strict mode overlay preview</p>
            <p class="gif-preview__headline">"Step away from the cat videos!"</p>
            <p class="gif-preview__caption">
              GIF flair is currently <strong id="gif-preview-state">on</strong>.
            </p>
          </div>
        </div>
      </section>
      <section>
        <h2>Distracting sites</h2>
        <form id="blocklist-form" class="blocklist-form">
          <input
            id="domain-input"
            type="url"
            inputmode="url"
            autocomplete="off"
            placeholder="https://example.com"
          />
          <button type="submit">Add domain</button>
        </form>
        <p id="domain-error" class="form-error" role="alert" aria-live="assertive" hidden></p>
        <table class="blocklist-table" aria-live="polite">
          <caption class="sr-only">
            Distracting domains
          </caption>
          <thead>
            <tr>
              <th scope="col">Domain</th>
              <th scope="col" class="actions">Status</th>
              <th scope="col" class="actions">Actions</th>
            </tr>
          </thead>
          <tbody id="blocklist-body"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
